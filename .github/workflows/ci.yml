name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: pytest --ignore=tests/test_playwright_integration.py
      - run: node --check xworkbench/static/app.js
      - run: node --test tests/test_analysis.mjs
      - run: xworkbench --help
      - run: python -m xworkbench --help
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Inspect packaged CLI and static assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("x_collection_workbench-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              assert {
                  "xworkbench/cli.py",
                  "xworkbench/mcp_server.py",
                  "xworkbench/playwright_browser.py",
                  "xworkbench/providers.py",
                  "xworkbench/static/analysis.js",
                  "xworkbench/static/app.js",
                  "xworkbench/static/index.html",
                  "xworkbench/static/styles.css",
              } <= names
              assert not any(name.startswith("xscraper/") for name in names)
              entry_points = next(name for name in names if name.endswith("entry_points.txt"))
              scripts = wheel.read(entry_points).decode()
              assert "xworkbench = xworkbench.cli:main" in scripts
              assert "xscraper =" not in scripts
          PY

  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: playwright install --with-deps chromium
      - name: Run offline local-Chromium integration test
        run: pytest tests/test_playwright_integration.py
      - name: Run bounded queue browser matrix
        env:
          XWORKBENCH_RUN_BROWSER_MATRIX: "1"
        run: pytest tests/test_queue_performance.py -k production_playwright
