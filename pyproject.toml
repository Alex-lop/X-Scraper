[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-collection-workbench"
version = "1.0.0"
description = "Local feed-to-context snapshot bridge for X"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
browser = [
  "playwright>=1.44,<2",
]
mcp = [
  "mcp>=2,<3",
]

[project.scripts]
xworkbench = "xworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["xworkbench*"]

[tool.setuptools.package-data]
xworkbench = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
