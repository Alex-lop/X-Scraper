[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-collection-workbench"
version = "0.1.0"
description = "Local, authenticated X/Twitter collection workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Flask>=3.0,<4",
  "playwright>=1.44,<2",
  "vaderSentiment>=3.3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
xscraper = "xscraper.cli:main"

[tool.setuptools.packages.find]
include = ["xscraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
